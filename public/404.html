<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | PAMCA</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/shared-styles.css">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <style>
    .nf { max-width: 640px; margin: 0 auto; padding: 96px 24px 112px; text-align: center; font-family: Arial, sans-serif; color: #333; }
    .nf-code { font-size: 0.9rem; font-weight: 700; letter-spacing: 0.12em; color: #008080; margin-bottom: 12px; }
    .nf h1 { font-size: 2rem; line-height: 1.25; margin-bottom: 16px; color: #1f2d2d; }
    .nf p { font-size: 1.05rem; line-height: 1.6; margin-bottom: 28px; color: #4a5a5a; }
    .nf-links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .nf-links a { display: inline-block; padding: 12px 22px; border-radius: 999px; font-weight: 600; text-decoration: none; }
    .nf-primary { background: #008080; color: #fff; }
    .nf-primary:hover { background: #006666; }
    .nf-secondary { border: 1px solid #008080; color: #006666; }
    .nf-secondary:hover { background: #f0f8f8; }
    .nf-links a:focus-visible { outline: 3px solid #006666; outline-offset: 3px; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main class="nf">
    <div class="nf-code">404</div>
    <h1>We couldn't find that page</h1>
    <p>The page may have moved, or the link may be out of date. These will get you back on track:</p>
    <div class="nf-links">
      <a class="nf-primary" href="/">Go to the homepage</a>
      <a class="nf-secondary" href="/pharmacy-products">Browse products</a>
      <a class="nf-secondary" href="/contact-us">Contact us</a>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/auth.js"></script>
  <script src="/shared-scripts.js"></script>
</body>
</html>
